[package]
name = "websocket-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
tokio-tungstenite = { version = "0.26.2", features = ["native-tls"] }
#native-tls = "0.2"
chrono = "0.4"
http = "0.2"
axum = { version = "0.8.1", features = ["ws"] }
tracing = "0.1.41"
clap = { version = "4", features = ["derive", "env"] }
dotenv = "0.15.0"
url = "2.5.4"
backoff = "0.4.0"
futures = "0.3.31"
async-trait = "0.1.86"
tracing-subscriber = "0.3.19"

[features]
integration = []
